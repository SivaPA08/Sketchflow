<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Inside Square</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .square {
      width: 60px;
      height: 60px;
      border: 2px solid white;
      position: relative;
    }

    .diamond-inside {
      width: 30px;
      height: 30px;
      border: 1px solid white;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(45deg); /* diamond = square rotated 45° */
      box-sizing: border-box;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="square">
    <div class="diamond-inside"></div>
  </div>
</body>
</html>
