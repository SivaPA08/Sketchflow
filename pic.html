<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bordered Tilted Line Inside Square</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .square {
      width: 60px;
      height: 60px;
      border: 2px solid white;
      position: relative;
    }

    .tilted-line {
      width: 2px;
      height: 40px;
      border-left: 4px double white;
      background-color: transparent;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="square">
    <div class="tilted-line"></div>
  </div>
</body>
</html>
